<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="app">
        <header class="app__header">
            <div class="app__title">
                <span class="dot" aria-hidden="true"></span>
                RAG Chat
            </div>
            <button id="clearBtn" class="btn-ghost" type="button" title="Start a new conversation">New chat</button>
        </header>

        <main id="messages" class="messages" aria-live="polite">
            <div class="empty" id="emptyState">
                <h1>Ask your documents anything</h1>
                <p>Answers are retrieved from your knowledge base and generated by Claude.</p>
            </div>
        </main>

        <form id="composer" class="composer" autocomplete="off">
            <textarea
                id="input"
                class="composer__input"
                placeholder="Type your question…  (Enter to send, Shift+Enter for a new line)"
                rows="1"
                required></textarea>
            <button id="sendBtn" class="composer__send" type="submit" title="Send">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path d="M4 12l16-8-6 8 6 8z" fill="currentColor"/>
                </svg>
            </button>
        </form>
    </div>

    <script src="assets/app.js"></script>
</body>
</html>
