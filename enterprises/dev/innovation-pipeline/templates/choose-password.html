<!-- ─────────────────────────────────────────────────────────────
     choose-password.html — Choose a new password (markup only)
     Directive 2 Oct 2026, Part 5.5. Shown after a sign-in with a temporary
     password, the administrator's first sign-in (the published password works
     once), or a stored password that breaks the rule (an old PIN). The server
     refuses everything else until it is done. Hydrated by auth.js →
     Entry.mount('choose-password', …); the sub-text says which case this is.
     ───────────────────────────────────────────────────────────── -->
<div class="login-screen"><div class="login-card entry-pass-card">
  <button type="button" class="entry-back" data-leave>&larr; Back to sign in</button>
  <div class="login-eyebrow" data-slot="module-name">90-Day Programs</div>
  <h1 class="login-title">Choose a new <em>password</em></h1>
  <p class="login-sub" data-slot="sub"></p>

  <form class="entry-form" data-auth="choose-password" novalidate autocomplete="off">
    <label class="entry-flabel" for="newPassword">New password</label>
    <input id="newPassword" class="entry-text-input" type="password" autocomplete="new-password"
           data-field="password" aria-describedby="newPasswordRule"/>
    <div class="entry-field-err" data-err="password" role="alert"></div>
    <div class="pw-rule" id="newPasswordRule">At least 8 characters, including a number and a special character such as ! or #.</div>

    <label class="entry-flabel" for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" class="entry-text-input" type="password" autocomplete="new-password"
           data-field="confirm"/>
    <div class="entry-field-err" data-err="confirm" role="alert"></div>

    <div class="entry-err" data-err="_general" role="alert" hidden></div>

    <button type="submit" class="btn-gold login-btn" data-submit>Save password</button>
  </form>
</div></div>
