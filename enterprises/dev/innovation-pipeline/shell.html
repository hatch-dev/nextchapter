  <!-- Rendered by index.php, which replaces this comment with:
         <base href="/apps/">   so every relative asset, template and api/ call
                                below resolves against the install directory no
                                matter how deep the route is
         window.APP_BOOT        the resolved route: role, module, page, step
         window.APP_CATALOGUE   the roles and their modules (config/catalogue.json)
       It must stay the FIRST thing in the head — the <base> has to precede the
       first relative URL on the page, and the registry has to see APP_BOOT
       before boot.js writes the module's <script> tags.
       shell.html is never served directly (see .htaccess); open the app at
       /apps/ instead. -->
  <!--{{BOOT}}-->

  <script>
    /* DEV COPY (13 Oct 2026): this copy is served from the same site as live (/apps/dev/ beside /apps/),
       so both would share one localStorage and sessionStorage. The copied database keeps live's
       organization ids, so live's cached workspaces, sign-in pointers and prefs would be read here as
       this copy's own (and written back over). Every key this page uses is kept under its own prefix
       instead: live sees none of dev's keys and dev sees none of live's. Must run before any other
       script touches storage. */
    (function () {
      try {
        var P = 'nc-dev::', S = Storage.prototype;
        var get = S.getItem, set = S.setItem, rem = S.removeItem, key = S.key;
        var lenGet = Object.getOwnPropertyDescriptor(S, 'length').get;
        function mine(st) {
          var out = [], n = lenGet.call(st);
          for (var i = 0; i < n; i++) { var k = key.call(st, i); if (k && k.indexOf(P) === 0) out.push(k.slice(P.length)); }
          return out;
        }
        S.getItem = function (k) { return get.call(this, P + k); };
        S.setItem = function (k, v) { return set.call(this, P + k, v); };
        S.removeItem = function (k) { return rem.call(this, P + k); };
        S.key = function (i) { var m = mine(this); return i >= 0 && i < m.length ? m[i] : null; };
        S.clear = function () { var m = mine(this); for (var i = 0; i < m.length; i++) rem.call(this, P + m[i]); };
        Object.defineProperty(S, 'length', { configurable: true, get: function () { return mine(this).length; } });
      } catch (e) { }
    })();
  </script>

  <script>
    /* Apply the saved theme before first paint (default: dark) so first-time and
       dark-mode users never see a light flash. Key written by Store.setPref —
       only an explicit 'light' preference opts out.
       One-time migration: browsers carrying a preference from when LIGHT was the
       default would never see the new default, so the first load after this change
       drops the stored value and starts dark. The toggle sticks again from there. */
    try {
      if (!localStorage.getItem('pipeline-theme-default-dark')) {
        localStorage.removeItem('pipeline-theme');
        localStorage.setItem('pipeline-theme-default-dark', '1');
      }
      document.documentElement.setAttribute('data-theme', localStorage.getItem('pipeline-theme') === 'light' ? 'light' : 'dark');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    /* Hold the page still under the boot loader — see html.app-booting below. */
    document.documentElement.classList.add('app-booting');
  </script>
  <script>
    /* Videos load when they are played, not when they are shown (12 Oct 2026).
       Every program's screens write <video preload="auto"> — the shared
       templates, app.js and the generated program code alike — and each video
       is 65-135 MB, so opening a home screen started pulling ~15 MB of video in
       its first 25 seconds with nothing pressed, competing with the app for the
       connection. One guard here covers every source, generated or not: any
       video added with preload="auto" (or none) is switched to "metadata"
       before the browser starts fetching it. The poster, the length and the
       controls still show; pressing play streams as before. A video that
       autoplays is left alone.

       A poster while it loads (28 Oct 2026). Most Enterprise videos were
       written without a poster, so until the first frame arrived they showed
       as an empty black box. Every Enterprise video now has a frame taken from
       it saved beside it under the same name (assets/media/.../exec-phase1.mp4
       → exec-phase1.jpg; this copy's assets/media/ is the main app's, see
       .htaccess), and any video in an Enterprise program with no poster of its
       own is given that frame. A video's own poster always wins. A new video
       needs its frame added the same way. */
    (function () {
      if (!window.MutationObserver) return;
      var boot = window.APP_BOOT, enterprise = !!(boot && boot.roleSlug === 'enterprises' && boot.moduleId);
      function thumb(v) {
        if (!enterprise || v.getAttribute('poster')) return;
        var el = v.getAttribute('src') ? v : v.querySelector('source[src]'), src = el ? el.getAttribute('src') : '';
        if (/\.mp4$/i.test(src)) v.setAttribute('poster', src.slice(0, -4) + '.jpg');
      }
      function tame(node) {
        if (!node || node.nodeType !== 1) return;
        // The parser can add a <video> before its <source>: catch the source arriving.
        if (node.tagName === 'SOURCE') { if (node.parentNode && node.parentNode.tagName === 'VIDEO') thumb(node.parentNode); return; }
        var list = node.tagName === 'VIDEO' ? [node] : (node.getElementsByTagName ? node.getElementsByTagName('video') : []);
        for (var i = 0; i < list.length; i++) {
          var v = list[i], p = v.getAttribute('preload');
          if (!v.autoplay && (p === null || p === '' || p === 'auto')) v.setAttribute('preload', 'metadata');
          thumb(v);
        }
      }
      new MutationObserver(function (records) {
        for (var r = 0; r < records.length; r++) {
          var added = records[r].addedNodes;
          for (var a = 0; a < added.length; a++) tame(added[a]);
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>

  <style>
    /* ── Boot loader ─────────────────────────────────────────────────────────
   A full-screen cover shown from the very first paint until the app has
   actually rendered. Inline here (not in styles.css) and with self-contained
   styles so it appears even before the stylesheet, fonts, or any script have
   loaded — which is exactly the window where the page used to flash unstyled.
   Removed by window.hideBootLoader() at the end of bootApp(). Theme colours
   mirror --ink/--paper so it matches the theme chosen before first paint. */
    #appBootLoader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #EAEEF4;
      color: #1E2530;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      opacity: 1;
      transition: opacity .45s ease;
    }

    :root[data-theme="dark"] #appBootLoader {
      background: #242E3C;
      color: #F4F6F9;
    }

    #appBootLoader.boot-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* While the loader is up, everything under it is invisible and nothing
       animates (12 Oct 2026). The shell is laid out for the 300px program
       sidebar until the app decides otherwise, and on every screen without one
       (sign-in, launchpad) the content then SLID 300px left with the sidebar's
       .25s margin transition — PageSpeed's layout-shift score, 0.25-0.36 on
       desktop. A hidden element's moves are not layout shifts, and with
       transitions off the page reaches its final layout in one step;
       hideBootLoader() settles that layout, then drops this class, so the
       loader lifts off a page that is already where it will stay. */
    html.app-booting body > :not(#appBootLoader),
    html.app-booting body > :not(#appBootLoader) * {
      visibility: hidden !important;
    }

    html.app-booting *,
    html.app-booting *::before,
    html.app-booting *::after {
      transition: none !important;
    }

    #appBootLoader .bl-word {
      font-size: clamp(21px, 4vw, 33px);
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    #appBootLoader .bl-word i {
      font-style: italic;
      letter-spacing: .14em;
      color: #076D9E;
    }

    #appBootLoader .bl-spin {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(232, 98, 26, .18);
      border-top-color: #E8621A;
      animation: blspin .8s linear infinite;
    }

    #appBootLoader .bl-sub {
      font-family: 'DM Mono', ui-monospace, 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      opacity: .5;
    }

    @keyframes blspin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion:reduce) {
      #appBootLoader .bl-spin {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>

<body>

  <!-- Boot loader: covers the page from first paint until the app has rendered
     (removed by window.hideBootLoader() at the end of bootApp in app.js). -->
  <div id="appBootLoader" role="status" aria-live="polite" aria-label="Loading the AI Innovation Pipeline">
    <div class="bl-word">AI Innovation <i>Pipeline</i></div>
    <div class="bl-spin"></div>
    <div class="bl-sub">Loading…</div>

  <script>
    /* Name the loader for the program that is actually starting, the instant its
       markup exists — before a paint can show another module's wordmark.
       boot.js runs it again on DOMContentLoaded for the header. */
    if (window.Modules && Modules.applyIdentity) Modules.applyIdentity();
  </script>
  <script>
    /* Defined early so it exists before app.js calls it. Fades the loader out and
       removes it; idempotent. A safety timeout hides it even if boot stalls or
       throws, so the loader can never trap the user on a blank page. */
    window.hideBootLoader = function () {
      var el = document.getElementById('appBootLoader');
      var root = document.documentElement;
      if (root.classList.contains('app-booting')) {
        /* Force the final layout NOW, while transitions are still off — or the
           sidebar margin would animate from its first-paint value the moment
           the class goes. Then show the page under the fading loader. */
        void root.offsetHeight;
        root.classList.remove('app-booting');
      }
      if (!el || el.__hiding) return;
      el.__hiding = 1;
      el.classList.add('boot-hidden');
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
    };
    setTimeout(function () { if (window.hideBootLoader) window.hideBootLoader(); }, 12000);
  </script>

  <!-- Sidebar: on click, scroll the menu so the clicked item anchors to the top.
     Click is captured BEFORE the app re-renders the sidebar (so the item is still
     in the DOM); the matching item is then re-located in the rebuilt menu and
     scrolled to the top of the scroll area. -->
  <script>
    (function () {
      var SB_ITEM = '.sidebar-step,.sidebar-home,.sidebar-outcome,.sidebar-phase-head,.sidebar-mini-row';
      document.addEventListener('click', function (e) {
        var sb = document.getElementById('pipSidebar');
        if (!sb) return;
        var item = e.target.closest && e.target.closest(SB_ITEM);
        if (!item || !sb.contains(item)) return;            // capture phase: item still attached
        var key = item.getAttribute('onclick') || item.textContent;
        // The inline onclick re-renders the sidebar synchronously; anchor on the next frame.
        requestAnimationFrame(function () {
          var scroll = document.querySelector('#pipSidebar .sidebar-scroll');
          if (!scroll) return;
          var items = scroll.querySelectorAll(SB_ITEM), match = null;
          for (var i = 0; i < items.length; i++) {
            if ((items[i].getAttribute('onclick') || items[i].textContent) === key) { match = items[i]; break; }
          }
          if (!match) return;
          var ANCHOR_OFFSET = 16; // breathing room so the anchored item's full text is visible
          var sRect = scroll.getBoundingClientRect(), iRect = match.getBoundingClientRect();
          scroll.scrollTo({ top: scroll.scrollTop + (iRect.top - sRect.top) - ANCHOR_OFFSET, behavior: 'smooth' });
        });
      }, true); // capture
    })();
  </script>

  <!-- YouTube facade: clicking the thumbnail swaps in the player (user gesture allows playback). -->
  <script>
    (function () {
      function load(f) {
        var id = f.getAttribute('data-yt'); if (!id) return;
        // Embedded playback can't work from a file:// page (YouTube needs a real origin/referrer),
        // so when opened directly from the desktop we open the video on YouTube instead.
        if (location.protocol === 'file:') {
          window.open('https://www.youtube.com/watch?v=' + id, '_blank', 'noopener');
          return;
        }
        var src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1';
        f.innerHTML = '<iframe src="' + src + '" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
        f.classList.remove('yt-facade'); f.removeAttribute('role'); f.removeAttribute('tabindex');
      }
      document.addEventListener('click', function (e) {
        var f = e.target.closest && e.target.closest('.yt-facade[data-yt]'); if (f) load(f);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var f = e.target.closest && e.target.closest('.yt-facade[data-yt]'); if (f) { e.preventDefault(); load(f); }
      });
    })();
  </script>
