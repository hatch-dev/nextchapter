<!-- Sidebar: on click, scroll the menu so the clicked item anchors to the top.
     Click is captured BEFORE the app re-renders the sidebar (so the item is still
     in the DOM); the matching item is then re-located in the rebuilt menu and
     scrolled to the top of the scroll area. -->
<script>
(function(){
  var SB_ITEM='.sidebar-step,.sidebar-home,.sidebar-outcome,.sidebar-phase-head,.sidebar-mini-row';
  document.addEventListener('click', function(e){
    var sb=document.getElementById('pipSidebar');
    if(!sb) return;
    var item=e.target.closest && e.target.closest(SB_ITEM);
    if(!item || !sb.contains(item)) return;            // capture phase: item still attached
    var key=item.getAttribute('onclick')||item.textContent;
    // The inline onclick re-renders the sidebar synchronously; anchor on the next frame.
    requestAnimationFrame(function(){
      var scroll=document.querySelector('#pipSidebar .sidebar-scroll');
      if(!scroll) return;
      var items=scroll.querySelectorAll(SB_ITEM), match=null;
      for(var i=0;i<items.length;i++){
        if((items[i].getAttribute('onclick')||items[i].textContent)===key){ match=items[i]; break; }
      }
      if(!match) return;
      var ANCHOR_OFFSET=16; // breathing room so the anchored item's full text is visible
      var sRect=scroll.getBoundingClientRect(), iRect=match.getBoundingClientRect();
      scroll.scrollTo({ top: scroll.scrollTop + (iRect.top - sRect.top) - ANCHOR_OFFSET, behavior:'smooth' });
    });
  }, true); // capture
})();
</script>

<!-- YouTube facade: clicking the thumbnail swaps in the player (user gesture allows playback). -->
<script>
(function(){
  function load(f){
    var id=f.getAttribute('data-yt'); if(!id) return;
    // Embedded playback can't work from a file:// page (YouTube needs a real origin/referrer),
    // so when opened directly from the desktop we open the video on YouTube instead.
    if(location.protocol==='file:'){
      window.open('https://www.youtube.com/watch?v='+id,'_blank','noopener');
      return;
    }
    var src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1';
    f.innerHTML='<iframe src="'+src+'" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
    f.classList.remove('yt-facade'); f.removeAttribute('role'); f.removeAttribute('tabindex');
  }
  document.addEventListener('click', function(e){
    var f=e.target.closest && e.target.closest('.yt-facade[data-yt]'); if(f) load(f);
  });
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var f=e.target.closest && e.target.closest('.yt-facade[data-yt]'); if(f){ e.preventDefault(); load(f); }
  });
})();
</script>
